# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c3de50d1466dc40754ea28f814d19b46"
name = "Tarifa de envío Perú"
application_url = "https://envio-peru-shopify-surtiplas.onrender.com"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_draft_orders,write_orders,write_shipping"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://envio-peru-shopify-surtiplas.onrender.com/auth/callback",
  "https://envio-peru-shopify-surtiplas.onrender.com/auth/shopify/callback"
]

[app_proxy]
url = "https://envio-peru-shopify-surtiplas.onrender.com/proxy"
subpath = "envio"
prefix = "apps"

[pos]
embedded = false
